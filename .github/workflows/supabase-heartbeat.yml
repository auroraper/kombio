name: Supabase Heartbeat

# Verhindert zwei Probleme:
# 1. Supabase pausiert das Projekt nach 7 Tagen Inaktivität
# 2. GitHub deaktiviert diesen Workflow nach 60 Tagen ohne Repo-Aktivitaet

on:
  schedule:
    # Laeuft taeglich um 06:17 UTC
    - cron: '17 6 * * *'
  workflow_dispatch: # Manuelles Ausloesen ueber den "Run workflow" Button

permissions:
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:

      # Schritt 1: Supabase anpingen (echte Datenbank-Anfrage)
      - name: Ping Supabase photos table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://buqhkvqtsnlnlwheotra.supabase.co/rest/v1/photos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "OK - Supabase ist aktiv und erreichbar"
          else
            echo "WARNUNG - Supabase antwortete mit Status $STATUS"
            exit 1
          fi

      # Schritt 2: Repo aktiv halten, damit GitHub diesen Workflow
      # nicht nach 60 Tagen abschaltet. Schlaegt das fehl, bleibt der
      # Lauf trotzdem gruen (continue-on-error), weil Schritt 1 zaehlt.
      - name: Checkout Repository
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Keep repository active
        continue-on-error: true
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "Letzter Commit vor $DAYS Tagen."

          if [ "$DAYS" -lt 40 ]; then
            echo "Noch frisch genug - kein Commit noetig."
            exit 0
          fi

          echo "Aelter als 40 Tage - setze Keepalive-Commit."
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-heartbeat.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-heartbeat.txt
          git commit -m "chore: keepalive heartbeat"
          git push
