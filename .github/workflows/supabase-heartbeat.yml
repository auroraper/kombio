name: Supabase Heartbeat

# Verhindert zwei Probleme:
# 1. Supabase pausiert das Projekt nach 7 Tagen Inaktivität
# 2. GitHub deaktiviert diesen Workflow nach 60 Tagen ohne Repo-Aktivität

on:
  schedule:
    # Läuft täglich um 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuelles Auslösen über den "Run workflow" Button auf GitHub

permissions:
  actions: write
  contents: write

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:

      # Schritt 1: Supabase anpingen (echte Datenbank-Anfrage)
      - name: Ping Supabase photos table
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://buqhkvqtsnlnlwheotra.supabase.co/rest/v1/photos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "⚠️ Warnung: Supabase antwortete mit Status $STATUS"
          else
            echo "✅ Supabase ist aktiv und erreichbar"
          fi

      # Schritt 2: GitHub-Repo aktiv halten damit dieser Workflow nicht deaktiviert wird
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Keep GitHub workflow active (verhindert 60-Tage-Deaktivierung)
        uses: gautamkrishnar/keepalive-workflow@v2
